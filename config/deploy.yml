# Name of your application. Used to uniquely configure containers.
service: school_app

# Name of the container image. GHCR namespaces are lowercase, so this is not the
# GitHub login's exact casing.
image: yarov1/school-app

# Deploy to these servers.
#
# Replace with the droplet's public IPv4 address. The GitHub Actions deploy job reads the
# address back out of this file to seed known_hosts, so it is configured here and nowhere else.
servers:
  web:
    - 203.0.113.10

# No domain is pointed at the droplet yet, so kamal-proxy serves plain HTTP on port 80 and
# Let's Encrypt stays off. When a domain lands, uncomment this block and, in the same change,
# turn on config.assume_ssl and config.force_ssl in config/environments/production.rb —
# an SSL-terminating proxy in front of Rails needs both, or the app builds http:// URLs and
# hands out non-secure cookies. See docs/deploy.md § Adding a domain.
#
# proxy:
#   ssl: true
#   host: tests.example.com

# Where you keep your container images.
registry:
  server: ghcr.io
  username: yaroV1

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # config/recurring.yml runs ExpireOverdueAttemptsJob every 30 seconds through this
    # supervisor, so without it attempts silently stay in_progress past their deadline —
    # the app is wrong, not merely slower.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Cores available to the application. Leave at 1 on a 1-vCPU droplet: extra Puma workers
    # on one core buy no throughput and multiply SQLite write contention, since every attempt
    # write holds the database lock for its whole :immediate transaction.
    # WEB_CONCURRENCY: 2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent volume holding every piece of state the app owns: the four production SQLite
# databases (primary, cache, queue, cable) and Active Storage's local disk service, which
# config/storage.yml also roots at /rails/storage. Destroying this volume destroys the app's
# data — see docs/deploy.md § Backups.
volumes:
  - "school_app_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # No layer cache configured: builds run on a GitHub Actions runner that keeps nothing
  # between runs, so every deploy pays a cold `bundle install` (~2 min). Registry-backed
  # caching needs a docker-container buildx driver on the runner — worth adding only if
  # build time starts to hurt. See docs/deploy.md § Build time.

# Use a different ssh user than root
# ssh:
#   user: app

