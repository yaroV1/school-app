<!-- A tiling field of stylus impressions, used as paper grain behind the app.

     The alpha is baked into the fill rather than left to CSS, because a background image
     cannot carry its own opacity and this must never be tunable up by accident: it sits
     behind body text, and at any strength where the marks become individually readable it
     is costing legibility. At 2% of a warm brown on cream it reads as pressed clay and
     nothing more. -->
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <g fill="#4a3a28" fill-opacity="0.022">
    <path d="M12 18l9 2.2-9 2.2zM27 18l9 2.2-9 2.2zM42 18l9 2.2-9 2.2zM72 18l9 2.2-9 2.2zM87 18l9 2.2-9 2.2z"/>
    <path d="M116 14l4.4 0-2.2 9zM126 14l4.4 0-2.2 9z"/>
    <path d="M20 50l9 2.2-9 2.2zM35 50l9 2.2-9 2.2zM64 50l9 2.2-9 2.2zM79 50l9 2.2-9 2.2zM94 50l9 2.2-9 2.2z"/>
    <path d="M122 46l4.4 0-2.2 9z"/>
    <path d="M10 82l9 2.2-9 2.2zM25 82l9 2.2-9 2.2zM40 82l9 2.2-9 2.2zM55 82l9 2.2-9 2.2z"/>
    <path d="M84 78l4.4 0-2.2 9zM94 78l4.4 0-2.2 9zM104 78l4.4 0-2.2 9z"/>
    <path d="M130 82l9 2.2-9 2.2z"/>
    <path d="M30 114l9 2.2-9 2.2zM45 114l9 2.2-9 2.2zM80 114l9 2.2-9 2.2zM95 114l9 2.2-9 2.2zM110 114l9 2.2-9 2.2z"/>
    <path d="M14 110l4.4 0-2.2 9z"/>
    <path d="M16 146l9 2.2-9 2.2zM31 146l9 2.2-9 2.2zM60 146l9 2.2-9 2.2z"/>
    <path d="M100 142l4.4 0-2.2 9zM110 142l4.4 0-2.2 9zM130 142l4.4 0-2.2 9z"/>
  </g>
</svg>
